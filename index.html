<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>熱量計算器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efee; --surface:#ffffff; --ink:#15262b; --muted:#5d7176; --line:#d3dedd;
  --primary:#0e5a5a; --primary-ink:#ffffff; --track:#d6e2e0;
  --pro:#2f6fdb; --carb:#e0a21b; --fat:#c4513b; --over:#c4513b; --ok:#0e5a5a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b1e; --surface:#172a2e; --ink:#e6f0ef; --muted:#92a9ad; --line:#26413f;
    --primary:#4fc1b4; --primary-ink:#06201d; --track:#26413f;
    --pro:#6fa2ff; --carb:#f0bb45; --fat:#ee7d67; --over:#ee7d67; --ok:#4fc1b4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --surface:#172a2e; --ink:#e6f0ef; --muted:#92a9ad; --line:#26413f;
  --primary:#4fc1b4; --primary-ink:#06201d; --track:#26413f;
  --pro:#6fa2ff; --carb:#f0bb45; --fat:#ee7d67; --over:#ee7d67; --ok:#4fc1b4;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px 16px 0}
h1{font-size:22px;margin:4px 0 0;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
section{display:none}
section.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.field{margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:9px;padding:11px 16px;font-weight:700;min-height:44px;width:100%}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px;width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--ink);padding:10px;min-height:44px}
.seg button.on{background:var(--primary);color:var(--primary-ink);font-weight:700}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:44px;height:44px;font-size:20px}
.datebar .d{font-weight:700;text-align:center}
.datebar .d small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);min-height:62px;min-width:0}
.wd small{font-size:12px;color:var(--muted)}
.wd b{font-size:16px;line-height:1.2}
.wd i{display:block;width:70%;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:3px}
.wd i u{display:block;height:100%;text-decoration:none;background:var(--ok)}
.wd i u.over{background:var(--over)}
.wd.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.wd.sel small{color:inherit;opacity:.85}
.wd.sel i{background:color-mix(in srgb,var(--primary-ink) 30%,transparent)}
.wd.sel i u{background:var(--primary-ink)}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.wd:disabled{opacity:.4;cursor:default}
.ringwrap{display:flex;align-items:center;gap:18px}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ringcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.rsub{font-size:12px;color:var(--muted);text-align:center}
.ring{width:100%;max-width:150px;aspect-ratio:1;position:relative}
.ring .num{font-size:28px}
.ring .lab{font-size:12px;padding:0 10px}
.stats{margin-top:4px}

.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .num{font-size:28px;font-weight:700;line-height:1.1}
.ring .lab{font-size:12px;color:var(--muted);padding:0 10px}
.ring .num.over{color:var(--over)}
.stats{flex:1;font-size:14px}
.stats div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
.stats div:last-child{border:0}
.stats b{font-weight:700}
.macro{margin-top:14px}
.macro .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.hint{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.gh h2{margin:0}
.gh span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meal{padding:14px 0 6px;border-top:1px solid var(--line)}
.gh+.meal{border-top:0}
.sec{font-size:14px;font-weight:700;color:var(--muted);margin:22px 2px 10px;letter-spacing:.04em}
.mh{display:flex;align-items:center;gap:10px}
.mh h3{font-size:17px;margin:0;font-weight:700}
.mh .ms{color:var(--muted);font-size:14px;flex:1}
.addbtn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:9px;padding:0 14px;min-height:40px;font-weight:700;font-size:14px}
.addbtn.open{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mh+.item,.mh+.empty{margin-top:10px}
.item .n{flex:1;min-width:0}
.item .n small{display:block;color:var(--muted);font-size:12px}
.item .k{font-weight:700;white-space:nowrap}
.x{background:transparent;border:0;color:var(--muted);font-size:18px;width:36px;height:36px;border-radius:8px}
.empty{color:var(--muted);font-size:14px;padding:8px 0 0}
.panel{margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.panel .grp{font-size:13px;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chipg{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden;max-width:100%}
.chipg .chip{border:0;border-radius:0;background:transparent}
.chipg .chipx{border:0;background:transparent;color:var(--muted);width:34px;min-height:36px;font-size:14px;border-left:1px solid var(--line)}
.divider{font-size:13px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12px;min-height:32px;white-space:nowrap}
.pill.ok{color:var(--ok)}
.pill.err{color:var(--over)}
.mh .ms.over{color:var(--over);font-weight:700}
.more{margin:2px 0 4px}
.more summary{cursor:pointer;color:var(--primary);font-size:14px;padding:6px 0}
.create{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.create h4{margin:0 0 10px;font-size:15px}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin:12px 0 0}
.chk input{width:20px;height:20px;min-height:0;flex:0 0 auto}
.flash{color:var(--ok);font-size:14px;font-weight:700;margin:10px 0 0;min-height:1.2em}
.result-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kv{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:20px}
.kv.main{grid-column:1/-1;background:var(--primary);color:var(--primary-ink)}
.kv.main small{color:inherit;opacity:.85}
.kv.main b{font-size:30px}
.warn{background:color-mix(in srgb,var(--over) 14%,transparent);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;min-height:56px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--primary);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.fsearch{width:100%;margin-bottom:8px}
.flist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.frow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.fmain{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:inherit;padding:8px 10px;min-height:44px;font:inherit;cursor:pointer}
.fmain:hover{background:var(--bg)}
.fn{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.fn small,.fk small{display:block;font-size:11px;color:var(--muted)}
.famt{display:flex;align-items:center;gap:3px;padding:0 6px;border-left:1px solid var(--line)}
.famt input{width:62px;min-height:36px;padding:4px 6px;text-align:right}
.famt em{font-style:normal;font-size:12px;color:var(--muted);min-width:1.2em}
.iamt{border-left:0;padding:0 8px}
.item .iamt input{width:64px}
.fk b{font-size:15px}
.fk{text-align:right;font-weight:600;white-space:nowrap}
.frow .chipx{border:0;background:transparent;color:var(--muted);width:36px;font-size:14px;border-left:1px solid var(--line);cursor:pointer}
.picker:empty{display:none}
.picker .ph{display:flex;justify-content:space-between;align-items:center}
.picker .ph h3{margin:0;font-size:16px}
@media (min-width:980px){
main{max-width:1040px}
#tab-goal,#tab-progress,#tab-sync{max-width:560px;margin:0 auto}
#tab-today.active{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:0 20px;align-items:start}
#tab-today>*{grid-column:1}
#tab-today>#picker{display:block;grid-column:2;grid-row:1/span 20;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface,var(--bg));border:1px solid var(--line);border-radius:14px;padding:16px}
#tab-today>#picker:empty{display:none}
.picker .panel{border-top:0;margin:0;padding:0}
.flist{max-height:none}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head><body><main>
  <div class="top"><h1>熱量計算器</h1><button id="syncPill" class="pill" type="button">雲端：未設定</button></div>
  <p class="sub">算出每日目標，記錄飲食，追蹤體重</p>

  <section id="tab-today" class="active">
    <div class="datebar">
      <button id="prevDay" aria-label="前一天">‹</button>
      <div class="d" id="dateLabel"></div>
      <button id="nextDay" aria-label="後一天">›</button>
    </div>
    <div id="weekbar" class="week" role="group" aria-label="本週"></div>
    <div id="summary" class="card"></div>
    <div id="meals"></div>
    <h2 class="sec">運動、體重與喝水</h2>
    <div id="exercise"></div>
    <div id="weightcard"></div>
    <div id="watercard"></div>
    <div id="picker" class="picker"></div>
  </section>

  <section id="tab-goal">
    <div class="card">
      <h2>身體資料</h2>
      <div class="field"><label>性別</label>
        <div class="seg" id="sexSeg"><button data-v="m">男</button><button data-v="f">女</button></div></div>
      <div class="row">
        <div class="field"><label for="gAge">年齡</label><input id="gAge" type="number" inputmode="numeric" min="10" max="100"></div>
        <div class="field"><label for="gH">身高 (cm)</label><input id="gH" type="number" inputmode="decimal" min="100" max="230"></div>
        <div class="field"><label for="gW">體重 (kg)</label><input id="gW" type="number" inputmode="decimal" min="30" max="250"></div>
      </div>
      <div class="field"><label for="gAct">活動量</label>
        <select id="gAct">
          <option value="1.2">久坐（幾乎不運動）</option>
          <option value="1.375">輕度（每週運動 1–3 天）</option>
          <option value="1.55">中度（每週運動 3–5 天）</option>
          <option value="1.725">高度（每週運動 6–7 天）</option>
        </select></div>
      <div class="field"><label for="gBmr">基礎代謝 BMR (kcal，選填)</label><input id="gBmr" type="number" inputmode="decimal" min="800" max="4000" placeholder="留空則用公式；可填 InBody 測得的數字"></div>
      <button class="btn ghost" id="useLatest" hidden style="margin-bottom:12px"></button>
      <div class="field"><label>目標</label>
        <div class="seg" id="goalSeg"><button data-v="cut">減脂</button><button data-v="maintain">維持</button><button data-v="bulk">增肌</button></div></div>
      <div class="row">
        <div class="field"><label for="gPct" id="gPctLab">熱量調整 (%)</label><input id="gPct" type="number" inputmode="decimal" min="0" max="35"></div>
        <div class="field"><label for="gPpk">蛋白質 (g/公斤體重)</label><input id="gPpk" type="number" inputmode="decimal" step="0.1" min="0.8" max="3"></div>
        <div class="field"><label for="gFat">脂肪佔熱量 (%)</label><input id="gFat" type="number" inputmode="decimal" min="15" max="45"></div>
      </div>
      <div class="divider">直接指定目標（選填，留空則自動計算）</div>
      <div class="row">
        <div class="field"><label for="gKcal">目標熱量 (kcal)</label><input id="gKcal" type="number" inputmode="decimal" min="800" max="6000"></div>
        <div class="field"><label for="gPro">蛋白質 (g)</label><input id="gPro" type="number" inputmode="decimal" min="0" max="500"></div>
      </div>
      <div class="row">
        <div class="field"><label for="gFatG">脂肪 (g)</label><input id="gFatG" type="number" inputmode="decimal" min="0" max="300"></div>
        <div class="field"><label for="gCarb">碳水 (g)</label><input id="gCarb" type="number" inputmode="decimal" min="0" max="1000"></div>
      </div>
      <div class="row">
        <div class="field"><label for="gNa">鈉上限 (mg)</label><input id="gNa" type="number" inputmode="decimal" min="500" max="6000"></div>
        <div class="field"></div>
      </div>
      <div class="divider">各餐目標熱量（選填，點心自動補足差額）</div>
      <div class="row">
        <div class="field"><label for="gMB">早餐 (kcal)</label><input id="gMB" type="number" inputmode="decimal" min="0" max="5000"></div>
        <div class="field"><label for="gML">午餐 (kcal)</label><input id="gML" type="number" inputmode="decimal" min="0" max="5000"></div>
        <div class="field"><label for="gMD">晚餐 (kcal)</label><input id="gMD" type="number" inputmode="decimal" min="0" max="5000"></div>
      </div>
      <p class="note" id="mealNote" style="margin-top:0"></p>
    </div>
    <div class="card" id="goalResult"></div>
  </section>

  <section id="tab-sync">
    <div class="card">
      <h2>Google 試算表同步</h2>
      <p class="sub">資料存在你自己的 Google 試算表。網址與 TOKEN 只保存在這台裝置的瀏覽器。</p>
      <div class="field"><label for="syUrl">Apps Script 網頁應用程式網址</label><input id="syUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label for="syToken">TOKEN 密碼（選填，後端沒設密碼時留空）</label><input id="syToken" type="password" autocomplete="off"></div>
      <div class="btnrow"><button class="btn" id="syConnect" type="button">儲存並同步</button><button class="btn ghost" id="syNow" type="button">立即同步</button></div>
      <p class="note" id="syStatus"></p>
    </div>
    <div class="card">
      <h2>說明</h2>
      <p class="note" style="margin-top:0">每次記錄後約 1.5 秒自動上傳；開啟頁面、切回頁面時會自動讀取試算表。第一次連線會把本機與試算表合併，同一筆兩邊都改過時以試算表為準。離線時資料先存在本機，連線後自動補傳。</p>
      <div class="btnrow" style="margin-top:12px"><button class="btn ghost" id="syOverwrite" type="button">以試算表為準（清空本機重新載入）</button><button class="btn ghost" id="syClear" type="button">清除連線設定</button></div>
    </div>
  </section>

  <section id="tab-progress">
    <div class="card">
      <h2>記錄體重</h2>
      <div class="row">
        <div class="field"><label for="wDate">日期</label><input id="wDate" type="date"></div>
        <div class="field"><label for="wKg">體重 (kg)</label><input id="wKg" type="number" inputmode="decimal" step="0.1" min="30" max="250"></div>
        <div class="field"><label for="wFat">體脂率 (%)</label><input id="wFat" type="number" inputmode="decimal" step="0.1" min="3" max="60"></div>
      </div>
      <button class="btn" id="addWeight">儲存體重</button>
    </div>
    <div class="card" id="progressView"></div>
  </section>
</main>

<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日</button>
  <button data-tab="goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>目標</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>進度</button>
  <button data-tab="sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.5 4.5 0 0 1 .5 9.5H7z"/></svg>同步</button>
</nav>
<script>
var DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzLtm8W7Hk2YB_a0JgMqVjcE_YNY5px0DfDmEcw100B3Yo6pagkJZhZEQepPKgeuR4c/exec';
var DEFAULT_TOKEN = '';
</script>
<script>(function(){
  var KEY='kcal-app-v1';
  var DEF={mealB:'',mealL:'',mealD:'',naTarget:2300,kcalOverride:'',proOverride:'',fatOverride:'',carbOverride:'',bmrOverride:'',addBack:false,sex:'m',age:30,height:170,weight:70,act:1.375,goal:'cut',pct:20,ppk:2.0,fatPct:25,saved:false};
  var S={profile:Object.assign({},DEF),foods:{},weights:[],myFoods:[],workouts:{},myEx:[],pHist:[],water:{}};

  function calc(p){
    var bmrF=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
    var bmr=num(p.bmrOverride)>0?num(p.bmrOverride):bmrF;
    var tdee=bmr*p.act;
    var kcalF=p.goal==='cut'?tdee*(1-p.pct/100):p.goal==='bulk'?tdee*(1+p.pct/100):tdee;
    var kcal=num(p.kcalOverride)>0?num(p.kcalOverride):kcalF;
    var protein=num(p.proOverride)>0?num(p.proOverride):p.ppk*p.weight;
    var fat=num(p.fatOverride)>0?num(p.fatOverride):kcal*(p.fatPct/100)/9;
    var carb=num(p.carbOverride)>0?num(p.carbOverride):Math.max(0,(kcal-protein*4-fat*9)/4);

        mL=num(p.mealL)>0?num(p.mealL):Math.round(kcal*0.35),
        mD=num(p.mealD)>0?num(p.mealD):Math.round(kcal*0.30);
    var snack=Math.max(0,Math.round(kcal)-mB-mL-mD);
    var meals={'早餐':mB,'午餐':mL,'晚餐':mD,'點心':snack};
    return {meals:meals,mealOver:(mB+mL+mD)>Math.round(kcal),na:num(p.naTarget,2300),kcalF:kcalF,bmrF:bmrF,bmr:bmr,tdee:tdee,kcal:kcal,protein:protein,fat:fat,carb:carb};

  function chart(w,key){
    var W=320,H=150,pl=30,pr=10,pt=10,pb=22;

    if(max-min<1){min-=0.5;max+=0.5;}
    var pd=(max-min)*0.15;min-=pd;max+=pd;
    function X(i){return pl+(w.length===1?0:i*(W-pl-pr)/(w.length-1));}
    function Y(v){return pt+(max-v)*(H-pt-pb)/(max-min);}
    var pts=w.map(function(x,i){return X(i)+','+Y(x[key]);}).join(' ');
    var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="折線圖">';
    [0,0.5,1].forEach(function(t){var v=max-(max-min)*t,y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y+3)+'" text-anchor="end">'+r1(v)+'</text>';});
    s+='<polyline points="'+pts+'" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    w.forEach(function(x,i){s+='<circle cx="'+X(i)+'" cy="'+Y(x[key])+'" r="3" fill="var(--primary)"/>';});
    s+='<text x="'+pl+'" y="'+(H-6)+'">'+w[0].date.slice(5)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+w[w.length-1].date.slice(5)+'</text></svg>';
    return s;
  }

  function merge3(n,L,R,B){
    var out={},keys={};
    Object.keys(L).forEach(function(k){keys[k]=1;});Object.keys(R).forEach(function(k){keys[k]=1;});
    Object.keys(keys).forEach(function(k){
      var l=L[k],r=R[k],b=B[k];
      var cl=l?ck(n,l):null,cr=r?ck(n,r):null,cb=b?ck(n,b):null;
      if(l&&r){out[k]=(cl===cr)?l:((cl!==cb&&cr===cb)?l:r);}
      else if(l){if(!b||cl!==cb)out[k]=l;}
      else if(r){if(!b||cr!==cb)out[k]=r;}
    });
    return out;
  }
  function diffOps(want,have){

      Object.keys(H).forEach(function(k){if(!W[k])ops.push({op:'delete',sheet:n,key:String(H[k][kc])});});
    });
    return ops;
  }

      var want=rowsFromState(),ops=diffOps(want,R);
      if(ops.length)await postChunks(ops);
      var changed=JSON.stringify(L)!==JSON.stringify(want);
      SYNC.base=want;saveBase();persist();SYNC.last=Date.now();setStatus('ok');
      var ae=document.activeElement;
      if(changed&&!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)))refreshAll();
    }catch(e){setStatus('error',String(e.message||e));}
    finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;push();}}
  }
  function renderSyncTab(){
    $('syUrl').value=SYNC.url;$('syToken').value=SYNC.token;
    $('syOverwrite').textContent=SYNC.confirm?'再按一次確認：清空本機並載入':'以試算表為準（清空本機重新載入）';
    setStatus(SYNC.state,SYNC.msg);
  }
  function initSync(){
    $('syncPill').onclick=function(){showTab('sync');};
    $('syConnect').onclick=function(){
      var u=$('syUrl').value.trim(),t=$('syToken').value.trim();
      if(!/^https:\/\/script\.google\.com\//.test(u)){setStatus('error','請填入完整的 Apps Script 網址');return;}
      SYNC.url=u;SYNC.token=t;
      try{localStorage.setItem(SKEY,JSON.stringify({url:u,token:t}));}catch(e){}
      pullMerge();
    };
    $('syNow').onclick=function(){if(!cfgOk()){setStatus('error','尚未設定');return;}pullMerge();};
    $('syOverwrite').onclick=function(){
      if(!cfgOk()){setStatus('error','尚未設定');return;}
      if(!SYNC.confirm){SYNC.confirm=true;renderSyncTab();return;}
      SYNC.confirm=false;
      S.foods={};S.workouts={};S.weights=[];S.water={};S.myFoods=[];S.myEx=[];SYNC.base={};
      persist();pullMerge();renderSyncTab();
    };
    $('syClear').onclick=function(){
      SYNC.url='';SYNC.token='';SYNC.base={};
      try{localStorage.removeItem(SKEY);localStorage.removeItem(BKEY);}catch(e){}
      renderSyncTab();setStatus('off');
    };
    loadCfg();SYNC.ready=true;
    setStatus(cfgOk()?'pending':'off');
    if(cfgOk())pullMerge();
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&cfgOk()&&Date.now()-SYNC.last>30000)pullMerge();});
    window.addEventListener('online',function(){if(cfgOk())pullMerge();});
  }

  load();
  if(!S.pHist.length)S.pHist=[{from:'0000-00-00',p:JSON.parse(JSON.stringify(S.profile))}];
  syncGoalInputs();
  renderToday();
  initSync();
})();
</script></body></html>
